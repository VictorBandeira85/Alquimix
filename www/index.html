<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alquimix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E4DCEF; --bg2:#F3EDF9; --ink:#2A1C4A; --muted:#6A5B90;
  --gold:#A8740F; --gold-bg:#F7E3A8; --candle:rgba(255,170,70,.22);
  --glass:rgba(255,255,255,.5); --edge:rgba(60,40,110,.5);
  --wood1:#B07D4F; --wood2:#7E5530;
  --panel:#FFFFFF; --btn:#FFFFFF; --btn-ink:#2A1C4A; --shade:rgba(42,28,74,.18);
  --veil:rgba(42,28,74,.5); --chip:#EFE8F8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#140F24; --bg2:#2B2048; --ink:#F3EEFF; --muted:#B6A8D9;
    --gold:#F4C55B; --gold-bg:#4A3A1A; --candle:rgba(255,160,60,.2);
    --glass:rgba(255,255,255,.09); --edge:rgba(230,220,255,.55);
    --wood1:#6B4428; --wood2:#3B2414;
    --panel:#261C44; --btn:#2E2352; --btn-ink:#F3EEFF; --shade:rgba(0,0,0,.4);
    --veil:rgba(8,5,20,.72); --chip:#33285A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#140F24; --bg2:#2B2048; --ink:#F3EEFF; --muted:#B6A8D9;
  --gold:#F4C55B; --gold-bg:#4A3A1A; --candle:rgba(255,160,60,.2);
  --glass:rgba(255,255,255,.09); --edge:rgba(230,220,255,.55);
  --wood1:#6B4428; --wood2:#3B2414;
  --panel:#261C44; --btn:#2E2352; --btn-ink:#F3EEFF; --shade:rgba(0,0,0,.4);
  --veil:rgba(8,5,20,.72); --chip:#33285A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(70% 45% at 50% 0%, var(--candle), transparent 70%),
    radial-gradient(110% 70% at 50% 60%, var(--bg2), var(--bg) 75%);
  background-color:var(--bg);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:10px 16px 12px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-size:22px;box-shadow:0 3px 0 var(--shade)}
.lvl{font-size:22px;font-weight:800}
.coins{display:flex;align-items:center;gap:6px;background:var(--gold-bg);color:var(--gold);font-weight:800;font-size:18px;padding:5px 6px 5px 12px;border-radius:999px}
.coins .plus{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2A1C4A;display:grid;place-items:center;font-size:18px;line-height:1}
.tip{min-height:46px;margin:6px 4px 0;text-align:center;color:var(--muted);font-size:16px;line-height:1.3}

#board{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;padding-top:16px}
.shelf{position:relative;display:flex;justify-content:center;gap:14px;padding:0 6px 4px}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;border-radius:4px;
  background:linear-gradient(var(--wood1),var(--wood2));box-shadow:0 8px 14px var(--shade), inset 0 2px 0 rgba(255,255,255,.15)}

.tube{position:relative;flex:0 0 auto;width:var(--tw);height:calc(var(--tw) * 3.3);transition:transform .18s ease}
.tube::before{content:"";position:absolute;left:-4px;right:-4px;top:0;height:8px;border-radius:6px;background:var(--edge);z-index:2}
.glass{position:absolute;left:0;right:0;top:4px;bottom:0;border:3px solid var(--edge);border-top:none;
  border-radius:0 0 calc(var(--tw) / 2) calc(var(--tw) / 2);background:var(--glass);overflow:hidden}
.glass::after{content:"";position:absolute;left:16%;top:9%;width:13%;bottom:20%;border-radius:999px;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.04));z-index:2;pointer-events:none}
.fill{position:absolute;left:3px;right:3px;bottom:3px;top:13%;display:flex;flex-direction:column-reverse;
  border-radius:0 0 calc(var(--tw) / 2) calc(var(--tw) / 2);overflow:hidden}
.layer{position:relative;flex:0 0 25%;transform-origin:bottom;display:grid;place-items:center;
  background-image:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%,rgba(0,0,0,.12))}
.layer.top::before{content:"";position:absolute;left:0;right:0;top:-1px;height:5px;background:rgba(255,255,255,.35);border-radius:50%}
.layer .sym{font-size:calc(var(--tw) * .36);line-height:1;color:rgba(0,0,0,.55);font-weight:800;z-index:1}
.layer.drop{animation:fillin .38s ease-out}
.tube.sel{transform:translateY(-16px)}
.tube.done .glass{box-shadow:0 0 22px 2px var(--glow)}
.tube.done .fill::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 30% 85%,rgba(255,255,255,.7) 0 2px,transparent 3px),
             radial-gradient(circle at 66% 65%,rgba(255,255,255,.55) 0 1.5px,transparent 2.5px),
             radial-gradient(circle at 46% 95%,rgba(255,255,255,.6) 0 2px,transparent 3px);
  animation:bubbles 2.6s linear infinite}
.cork{position:absolute;left:10%;right:10%;top:-12px;height:18px;border-radius:6px 6px 3px 3px;z-index:3;
  background:linear-gradient(#D4A574,#8A5E36);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.cork.pop{animation:pop .4s cubic-bezier(.3,1.7,.6,1)}
.tube.no{animation:shake .3s}
.tube.hint .glass{animation:pulse 1s ease-in-out infinite}
.stream{position:fixed;z-index:16;border-radius:4px;transform-origin:top;pointer-events:none}
.spark{position:fixed;z-index:40;width:8px;height:8px;border-radius:2px;pointer-events:none}

/* temas de frasco */
body.th-neon .glass{border-color:#7DF9FF;box-shadow:0 0 10px rgba(125,249,255,.45), inset 0 0 8px rgba(125,249,255,.25)}
body.th-neon .tube::before{background:#7DF9FF}
body.th-neon .layer{box-shadow:inset 0 0 10px rgba(255,255,255,.35)}
body.th-ouro .glass{border-color:#D4AF37;background:linear-gradient(90deg,rgba(212,175,55,.12),var(--glass))}
body.th-ouro .tube::before{background:linear-gradient(90deg,#B8902B,#F5D77A,#B8902B)}
body.th-doces .glass{border-radius:0 0 calc(var(--tw) / 2.2) calc(var(--tw) / 2.2);border-color:#F3A6C8}
body.th-doces .tube::before{background:#F3A6C8}

@keyframes fillin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--gold)}}
@keyframes bubbles{from{transform:translateY(25%);opacity:0}30%{opacity:1}to{transform:translateY(-55%);opacity:0}}
@keyframes pop{from{transform:translateY(-14px) scale(.6);opacity:0}to{transform:none;opacity:1}}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.tool{background:var(--btn);color:var(--btn-ink);border-radius:16px;padding:8px 4px 6px;box-shadow:0 3px 0 var(--shade);
  display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:14px;line-height:1.15}
.tool .ic{font-size:22px}
.tool small{font-weight:600;color:var(--muted);font-size:12px}
.tool:active,.iconbtn:active,.big:active,.coins:active{transform:translateY(2px)}
.tool:disabled{opacity:.4}

.overlay{position:fixed;inset:0;background:var(--veil);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.show{display:flex}
#buy{z-index:25}
.card{background:var(--panel);border-radius:24px;padding:24px 20px;width:100%;max-width:420px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 40px var(--shade)}
.card h1{font-size:46px;line-height:1;margin:4px 0 6px;font-weight:800}
.card h2{font-size:30px;line-height:1.1;margin:0 0 8px;font-weight:800}
.card h3{font-size:19px;margin:18px 0 8px;text-align:left;font-weight:800}
.card p{margin:0 0 16px;color:var(--muted);font-size:17px;line-height:1.35}
.big{display:block;width:100%;padding:14px;border-radius:18px;background:var(--gold);color:#2A1C4A;font-weight:800;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ghost{display:block;width:100%;padding:10px;margin-top:8px;color:var(--muted);font-weight:700;font-size:16px}
.second{display:block;width:100%;padding:12px;margin-top:10px;border-radius:16px;background:var(--chip);font-weight:800;font-size:18px}
.logo{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.logo span{width:18px;height:44px;border-radius:4px 4px 10px 10px;border:3px solid var(--edge);border-top-width:6px;position:relative;overflow:hidden}
.logo span i{position:absolute;left:0;right:0;bottom:0}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 12px}
.levels button{aspect-ratio:1;border-radius:14px;background:var(--chip);font-weight:800;font-size:18px}
.levels button.cur{background:var(--gold);color:#2A1C4A}
.levels button:disabled{opacity:.35}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;color:var(--muted);font-size:14px}
.row button{color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.adbox{border:2px dashed var(--muted);border-radius:18px;padding:28px 12px;margin-bottom:16px}
.adbox b{display:block;font-size:56px;line-height:1;color:var(--gold)}
.reward{font-size:20px;font-weight:800;color:var(--gold);margin-bottom:16px}

.item{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:16px;padding:10px 12px;margin-bottom:8px;text-align:left}
.item .info{flex:1;min-width:0}
.item b{display:block;font-size:17px;line-height:1.2}
.item span{display:block;color:var(--muted);font-size:14px;line-height:1.25}
.item .tag{display:inline-block;background:var(--gold);color:#2A1C4A;border-radius:999px;padding:0 8px;font-size:12px;font-weight:800;margin-left:4px;vertical-align:2px}
.price{flex:0 0 auto;min-width:92px;padding:9px 10px;border-radius:12px;background:var(--gold);color:#2A1C4A;font-weight:800;font-size:15px}
.price.used{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--muted)}
.price.owned{background:var(--btn);color:var(--btn-ink)}
.mini{flex:0 0 auto;width:22px;height:54px;border:3px solid var(--edge);border-top-width:5px;border-radius:4px 4px 11px 11px;overflow:hidden;display:flex;flex-direction:column-reverse}
.mini i{flex:0 0 33.33%}
.bigcoin{font-size:30px;width:44px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px var(--shade);
  font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:45;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion: reduce){
  .layer.drop,.tube.no,.tube.hint .glass,.cork.pop,.tube.done .fill::after{animation:none}
  .tube{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn" id="btnMenu" aria-label="Menu e níveis">☰</button>
    <div class="lvl">Nível <span id="lvlNum">1</span></div>
    <button class="coins" id="btnCoins" aria-label="Moedas, abrir loja">🪙 <span id="coins">0</span><span class="plus">+</span></button>
  </header>
  <p class="tip" id="tip"></p>
  <main id="board" aria-label="Frascos"></main>
  <nav class="tools">
    <button class="tool" id="btnUndo"><span class="ic">↩️</span>Desfazer<small id="undoLeft">3</small></button>
    <button class="tool" id="btnHint"><span class="ic">💡</span>Dica<small>15 🪙</small></button>
    <button class="tool" id="btnTube"><span class="ic">🧪</span>+1 frasco<small id="tubeSub">📺 anúncio</small></button>
    <button class="tool" id="btnRestart"><span class="ic">🔄</span>Reiniciar<small>&nbsp;</small></button>
  </nav>
</div>

<div class="overlay show" id="home">
  <div class="card">
    <div class="logo" aria-hidden="true">
      <span><i style="height:70%;background:#E8394B"></i></span>
      <span><i style="height:45%;background:#3BBF5C"></i></span>
      <span><i style="height:85%;background:#3A7BEB"></i></span>
      <span><i style="height:60%;background:#F5D13B"></i></span>
    </div>
    <h1>Alquimix</h1>
    <p>Separe as poções por cor, um frasco para cada.</p>
    <button class="big" id="btnPlay">Jogar nível 1</button>
    <button class="second" id="btnShopHome">🛒 Loja</button>
    <div class="levels" id="levels"></div>
    <div class="row">
      <button id="btnSound">Som: ligado</button>
      <button id="btnSym">Símbolos de cor: desligados</button>
      <button id="btnReset">Apagar progresso</button>
      <button id="btnPrivacy" style="display:none">Privacidade dos anúncios</button>
    </div>
    <p style="margin:14px 0 0;font-size:13px" id="modeNote"></p>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="card">
    <h2>Loja</h2>
    <p style="margin-bottom:4px">Você tem 🪙 <b id="shopCoins">0</b></p>
    <h3>Sem anúncios</h3>
    <div id="shopNoAds"></div>
    <h3>Moedas</h3>
    <div id="shopCoinsList"></div>
    <h3>Estilos de frasco</h3>
    <div id="shopThemes"></div>
    <button class="second" id="btnRestore">Restaurar compras</button>
    <button class="ghost" id="btnShopClose">Fechar</button>
  </div>
</div>

<div class="overlay" id="buy">
  <div class="card">
    <h2>Compra de teste</h2>
    <p id="buyText"></p>
    <p style="font-size:14px">No app real, aqui abre o pagamento da Google Play ou da App Store.</p>
    <button class="big" id="btnBuyOk">Confirmar compra</button>
    <button class="ghost" id="btnBuyCancel">Cancelar</button>
  </div>
</div>

<div class="overlay" id="win">
  <div class="card">
    <h2 id="winTitle">Poções em ordem!</h2>
    <p id="winText"></p>
    <div class="reward" id="winReward"></div>
    <button class="big" id="btnNext">Próximo nível</button>
    <button class="ghost" id="btnDouble">📺 Assistir anúncio e dobrar moedas</button>
  </div>
</div>

<div class="overlay" id="ad">
  <div class="card">
    <div class="adbox">
      <p style="margin-bottom:8px" id="adKind">Anúncio de teste</p>
      <b id="adCount">3</b>
    </div>
    <div class="reward" id="adReward"></div>
    <button class="big" id="btnAdClaim" disabled>Aguarde…</button>
    <button class="ghost" id="btnAdClose">Fechar sem recompensa</button>
    <button class="ghost" id="btnAdNoAds" style="display:none">Remover anúncios</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="native.js"></script>
<script>
(async function(){
const CAP = 4, MAX_LEVEL = 50, HINT_COST = 15, INTER_EVERY = 3;
const SYMS = ['●','▲','■','◆','★','✚','♥','✖','☾','✿'];
const THEMES = {
  classico:{ name:'Clássico', desc:'O frasco de sempre.', cost:0,
    colors:['#E8394B','#F28C28','#F5D13B','#3BBF5C','#26C6C0','#3A7BEB','#9B4DE0','#F06BB4','#8B5A2B','#ECE6F7'] },
  doces:{ name:'Doces', desc:'Cores de confeitaria.', cost:250,
    colors:['#F58A97','#F9B47A','#F7DC6F','#8FD98A','#7FD6CF','#8DB4F0','#BE93E8','#F4A3CF','#B98A62','#FFFFFF'] },
  neon:{ name:'Neon', desc:'Brilho de laboratório secreto.', cost:250,
    colors:['#FF2E63','#FF8A00','#FFE600','#39FF14','#00F5D4','#2D9CFF','#B14AFF','#FF4FD8','#C77D3A','#FFFFFF'] },
  ouro:{ name:'Ouro', desc:'Frascos dourados e cores de joia.', price:'R$ 4,90', product:'theme_ouro',
    colors:['#C8102E','#E86A10','#F2C230','#1E9E5A','#12A3A0','#1F5FD1','#7B2FC0','#D6418C','#7A4A1E','#F4EBD0'] }
};
const COIN_PACKS = [
  { amt:200, price:'R$ 4,90', product:'coins200' },
  { amt:600, price:'R$ 9,90', tag:'+20%', product:'coins600' },
  { amt:1500, price:'R$ 19,90', tag:'Melhor valor', product:'coins1500' }
];
const NOADS = { price:'R$ 9,90', product:'noads' };
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- nativo (Capacitor) ou navegador ---------- */
// native.js é gerado por "npm run build". Sem ele (ou no navegador) o jogo usa o modo simulado.
const N = window.AlquimixNative || {
  isNative:false,
  storage:{ get: async k => localStorage.getItem(k), set: async (k, v) => localStorage.setItem(k, v) },
  haptic(){},
  ads:{ ready:false, init: async () => {}, privacyOptionsRequired: async () => false },
  iap:{ enabled:false, init: async () => {}, price: () => null }
};
const realAds = () => N.isNative && N.ads.ready;
const realIap = () => N.iap.enabled;
const priceOf = (product, fallback) => (realIap() && N.iap.price(product)) || fallback;

/* ---------- salvar ---------- */
const SAVE_KEY = 'alquimix-v1';
let save = { unlocked:1, coins:0, sound:true, noAds:false, owned:['classico'], theme:'classico', sym:false };
try { const s = JSON.parse(await N.storage.get(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch(e){}
function persist(){ N.storage.set(SAVE_KEY, JSON.stringify(save)).catch(() => {}); }
const palette = () => THEMES[save.theme].colors;
function applyTheme(){ document.body.className = 'th-' + save.theme; }

/* ---------- lógica ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const levelColors = n => Math.min(10, 3 + Math.floor((n - 1) / 3));
const isDone = t => t.length === 0 || (t.length === CAP && t.every(c => c === t[0]));
const isFull = t => t.length === CAP && isDone(t);
const solved = tubes => tubes.every(isDone);
function topRun(t){ if (!t.length) return 0; const c = t[t.length-1]; let k = 0; for (let i = t.length-1; i >= 0 && t[i] === c; i--) k++; return k; }
function canPour(a, b){ if (!a.length || b.length >= CAP) return false; return !b.length || b[b.length-1] === a[a.length-1]; }
function pour(a, b){ const k = Math.min(topRun(a), CAP - b.length); for (let i = 0; i < k; i++) b.push(a.pop()); return k; }
const key = tubes => tubes.map(t => t.join(',')).sort().join('|');

function solve(start, limit){
  const seen = new Set(); let nodes = 0; const path = [];
  function dfs(s){
    if (solved(s)) return true;
    if (++nodes > limit) return false;
    const k = key(s); if (seen.has(k)) return false; seen.add(k);
    const moves = [];
    for (let i = 0; i < s.length; i++){
      const a = s[i]; if (!a.length || isDone(a)) continue;
      const run = topRun(a), mono = run === a.length;
      for (let j = 0; j < s.length; j++){
        if (i === j) continue; const b = s[j];
        if (!canPour(a, b)) continue;
        if (mono && !b.length) continue;
        moves.push([i, j, b.length ? (CAP - b.length >= run ? 3 : 1) : 0]);
      }
    }
    moves.sort((x, y) => y[2] - x[2]);
    for (const [i, j] of moves){
      const n = s.map(t => t.slice()); pour(n[i], n[j]); path.push([i, j]);
      if (dfs(n)) return true;
      path.pop(); if (nodes > limit) return false;
    }
    return false;
  }
  return dfs(start.map(t => t.slice())) ? path.slice() : null;
}

const levelCache = {};
function makeLevel(n){
  if (levelCache[n]) return levelCache[n].map(t => t.slice());
  const k = levelColors(n); let last = null;
  for (let attempt = 0; attempt < 40; attempt++){
    const r = rng(n * 7919 + attempt * 104729);
    const units = []; for (let c = 0; c < k; c++) for (let i = 0; i < CAP; i++) units.push(c);
    for (let i = units.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [units[i], units[j]] = [units[j], units[i]]; }
    const tubes = []; for (let c = 0; c < k; c++) tubes.push(units.slice(c * CAP, c * CAP + CAP));
    tubes.push([], []); last = tubes;
    if (tubes.some(t => t.length && isDone(t))) continue;
    if (solve(tubes, 40000)) break;
  }
  levelCache[n] = last.map(t => t.slice());
  return last.map(t => t.slice());
}

/* ---------- estado ---------- */
let level = 1, tubes = [], history = [], sel = null, moves = 0, undos = 3, extraUsed = false;
let lastDrop = null, justDone = null, hint = null, earned = 0, busy = false, hiddenTube = null;

function startLevel(n){
  level = n; tubes = makeLevel(n); history = []; sel = null; moves = 0; undos = 3; extraUsed = false;
  lastDrop = null; justDone = null; hint = null; busy = false; hiddenTube = null;
  $('lvlNum').textContent = n;
  $('tip').textContent = n === 1
    ? 'Toque num frasco e depois em outro para despejar. Só dá para despejar sobre a mesma cor ou num frasco vazio.'
    : n === 4 ? 'Travou? Use o desfazer, uma dica ou ganhe um frasco extra.' : '';
  render();
}

/* ---------- som ---------- */
let actx = null;
function beep(freqs, dur, type){
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
      g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    });
  } catch(e){}
}
function gurgle(){
  if (!save.sound) return;
  [0, 90, 180].forEach((d, i) => setTimeout(() => beep([300 + i * 80 + Math.random() * 60], .08, 'triangle'), d));
}

/* ---------- desenho ---------- */
let tw = 50;
function layout(){
  const n = tubes.length, cols = n <= 6 ? n : Math.ceil(n / 2), rows = Math.ceil(n / cols);
  const availW = Math.min(window.innerWidth, 560) - 44;
  const availH = window.innerHeight - 270;
  tw = Math.min(60, Math.floor((availW - (cols - 1) * 14) / cols));
  tw = Math.min(tw, Math.floor((availH - (rows - 1) * 44) / (rows * 3.3 + .4)));
  tw = Math.max(26, tw);
  $('board').style.setProperty('--tw', tw + 'px');
  return cols;
}
const tubeEl = i => $('board').querySelector(`.tube[data-i="${i}"]`);

function render(){
  const cols = layout(), pal = palette();
  const b = $('board'); b.innerHTML = '';
  let shelf = null;
  tubes.forEach((t, i) => {
    if (i % cols === 0){ shelf = document.createElement('div'); shelf.className = 'shelf'; b.appendChild(shelf); }
    const el = document.createElement('button');
    el.className = 'tube'; el.dataset.i = i;
    el.setAttribute('aria-label', `Frasco ${i + 1}, ${t.length} de ${CAP}`);
    if (sel === i) el.classList.add('sel');
    if (hiddenTube === i) el.style.visibility = 'hidden';
    if (isFull(t)){
      el.classList.add('done'); el.style.setProperty('--glow', pal[t[0]]);
      const c = document.createElement('div'); c.className = 'cork' + (justDone === i ? ' pop' : ''); el.appendChild(c);
    }
    if (hint && (hint[0] === i || hint[1] === i)) el.classList.add('hint');
    const g = document.createElement('div'); g.className = 'glass';
    const f = document.createElement('div'); f.className = 'fill';
    t.forEach((c, k) => {
      const l = document.createElement('div'); l.className = 'layer'; l.style.backgroundColor = pal[c];
      if (k === t.length - 1) l.classList.add('top');
      if (lastDrop && lastDrop.to === i && k >= t.length - lastDrop.n) l.classList.add('drop');
      if (save.sym){ const s = document.createElement('span'); s.className = 'sym'; s.textContent = SYMS[c]; l.appendChild(s); }
      f.appendChild(l);
    });
    g.appendChild(f); el.appendChild(g);
    el.addEventListener('click', () => tap(i));
    shelf.appendChild(el);
  });
  lastDrop = null; justDone = null;
  $('coins').textContent = save.coins;
  $('undoLeft').textContent = undos > 0 ? undos : (save.noAds ? '+3' : '📺 +3');
  $('tubeSub').textContent = save.noAds ? 'grátis' : '📺 anúncio';
  $('btnUndo').disabled = history.length === 0;
  $('btnTube').disabled = extraUsed;
}

function bump(i){ const el = tubeEl(i); if (!el) return; el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); }

function burst(x, y, colors, count, spread){
  if (reduceMotion()) return;
  for (let k = 0; k < count; k++){
    const s = document.createElement('div'); s.className = 'spark';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.background = colors[k % colors.length];
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, d = spread * (.4 + Math.random() * .6);
    s.animate([
      { transform:'translate(-50%,-50%) rotate(0)', opacity:1 },
      { transform:`translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 40}px)) rotate(${Math.random() * 540}deg)`, opacity:0 }
    ], { duration: 700 + Math.random() * 500, easing:'cubic-bezier(.2,.7,.3,1)' }).finished.then(() => s.remove());
  }
}

/* ---------- jogar ---------- */
function tap(i){
  if (busy) return;
  hint = null;
  if (sel === null){
    if (!tubes[i].length){ bump(i); return; }
    sel = i; beep([520], .05); render(); return;
  }
  if (sel === i){ sel = null; render(); return; }
  if (canPour(tubes[sel], tubes[i])){ doPour(sel, i); }
  else if (tubes[i].length){ sel = i; render(); }
  else { bump(i); }
}

async function doPour(from, to){
  history.push(tubes.map(t => t.slice()));
  const n = Math.min(topRun(tubes[from]), CAP - tubes[to].length);
  const color = tubes[from][tubes[from].length - 1];

  if (reduceMotion()){
    pour(tubes[from], tubes[to]); moves++; sel = null; lastDrop = { to, n };
    if (isFull(tubes[to])) justDone = to;
    render(); gurgle(); N.haptic('pour'); afterPour(to); return;
  }

  busy = true;
  const srcEl = tubeEl(from), dstEl = tubeEl(to);
  const sr = srcEl.getBoundingClientRect(), dr = dstEl.getBoundingClientRect();
  const clone = srcEl.cloneNode(true);
  clone.classList.remove('sel', 'hint', 'no');
  Object.assign(clone.style, { position:'fixed', left:sr.left + 'px', top:sr.top + 'px', margin:'0', zIndex:15,
    transformOrigin:'50% 0', transform:'none', transition:'none' });
  clone.style.setProperty('--tw', tw + 'px');
  document.body.appendChild(clone);
  srcEl.style.visibility = 'hidden'; hiddenTube = from;

  const dir = (dr.left + dr.width / 2) >= (sr.left + sr.width / 2) ? 1 : -1;
  const ang = 78 * dir;
  const mx = dr.left + dr.width / 2 - dir * tw * .15, my = dr.top - tw * .35;
  const dx = mx - (sr.left + sr.width / 2), dy = my - sr.top;

  await clone.animate([{ transform:'translate(0,0) rotate(0deg)' }, { transform:`translate(${dx}px,${dy}px) rotate(${ang}deg)` }],
    { duration:260, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' }).finished;

  // jato de líquido
  const fillH = (dr.height - 7) * .87;
  const surface = dr.bottom - 3 - fillH * tubes[to].length / CAP;
  const st = document.createElement('div'); st.className = 'stream';
  const sw = Math.max(4, Math.round(tw * .14));
  Object.assign(st.style, { left:(dr.left + dr.width / 2 - sw / 2) + 'px', top:(my + 2) + 'px', width:sw + 'px',
    height:Math.max(8, surface - my) + 'px', background:palette()[color] });
  document.body.appendChild(st);
  st.animate([{ transform:'scaleY(0)' }, { transform:'scaleY(1)' }], { duration:110, fill:'forwards' });
  gurgle(); N.haptic('pour');

  const layers = [...clone.querySelectorAll('.layer')];
  layers.slice(-n).forEach(l => l.animate([{ flexBasis:'25%' }, { flexBasis:'0%' }], { duration:380, easing:'ease-in', fill:'forwards' }));

  pour(tubes[from], tubes[to]); moves++; sel = null; lastDrop = { to, n };
  if (isFull(tubes[to])) justDone = to;
  render();
  await sleep(380);

  st.animate([{ opacity:1 }, { opacity:0 }], { duration:120, fill:'forwards' }).finished.then(() => st.remove());
  const rest = tubeEl(from).getBoundingClientRect();
  await clone.animate([{ transform:`translate(${dx}px,${dy}px) rotate(${ang}deg)` },
    { transform:`translate(${rest.left - sr.left}px,${rest.top - sr.top}px) rotate(0deg)` }],
    { duration:240, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' }).finished;
  clone.remove();
  hiddenTube = null;
  const back = tubeEl(from); if (back) back.style.visibility = '';
  busy = false;
  afterPour(to);
}

function afterPour(to){
  if (isFull(tubes[to])){
    beep([784, 1047], .1); N.haptic('done');
    const r = tubeEl(to).getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, [palette()[tubes[to][0]], '#FFFFFF', '#F4C55B'], 14, 60);
  }
  if (solved(tubes)) setTimeout(win, 380);
}

/* ---------- ferramentas ---------- */
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

$('btnUndo').onclick = () => {
  if (busy || !history.length) return;
  if (undos <= 0){ rewarded('+3 desfazer', () => { undos = 3; render(); toast('Você ganhou 3 desfazer'); }); return; }
  tubes = history.pop(); undos--; sel = null; hint = null; moves = Math.max(0, moves - 1); render();
};
$('btnRestart').onclick = () => { if (!busy) startLevel(level); };
$('btnTube').onclick = () => {
  if (busy || extraUsed) return;
  rewarded('+1 frasco vazio', () => {
    extraUsed = true; tubes.push([]); history.forEach(h => h.push([])); sel = null; render(); toast('Frasco extra adicionado');
  });
};
$('btnHint').onclick = () => {
  if (busy) return;
  if (save.coins < HINT_COST){ toast('Moedas insuficientes'); openShop(); return; }
  const path = solve(tubes, 60000);
  if (!path || !path.length){ toast('Sem saída a partir daqui. Desfaça ou reinicie.'); return; }
  save.coins -= HINT_COST; persist();
  hint = path[0]; sel = null; render();
};

/* ---------- anúncios: AdMob no app, simulados no navegador ---------- */
let adCb = null, adTimer = null, adBusy = false;
async function rewarded(label, cb){
  if (save.noAds){ cb(); return; }
  if (!N.isNative){ openAd('reward', 'Recompensa: ' + label, cb); return; }
  if (adBusy) return;
  adBusy = true;
  const r = realAds() ? await N.ads.showRewarded() : 'unavailable';
  adBusy = false;
  if (r === 'rewarded') cb();
  else if (r === 'closed') toast('Assista até o fim para ganhar a recompensa');
  else toast('Nenhum anúncio disponível agora. Tente de novo em instantes.');
}
async function interstitial(cb){
  if (save.noAds){ cb(); return; }
  if (!N.isNative){ openAd('inter', 'Anúncio entre níveis', cb); return; }
  if (realAds()) await N.ads.showInterstitial();
  cb();
}
function openAd(kind, text, cb){
  adCb = cb; let s = 3;
  $('adKind').textContent = 'Anúncio de teste';
  $('adReward').textContent = text;
  $('adCount').textContent = s;
  const claim = $('btnAdClaim'); claim.disabled = true; claim.textContent = 'Aguarde…';
  $('btnAdClose').style.display = kind === 'reward' ? '' : 'none';
  $('btnAdNoAds').style.display = kind === 'inter' ? '' : 'none';
  claim.dataset.kind = kind;
  $('ad').classList.add('show');
  clearInterval(adTimer);
  adTimer = setInterval(() => {
    s--; $('adCount').textContent = Math.max(s, 0);
    if (s <= 0){ clearInterval(adTimer); claim.disabled = false; claim.textContent = kind === 'reward' ? 'Pegar recompensa' : 'Continuar'; }
  }, 1000);
}
$('btnAdClaim').onclick = () => { $('ad').classList.remove('show'); const cb = adCb; adCb = null; if (cb) cb(); };
$('btnAdClose').onclick = () => { clearInterval(adTimer); adCb = null; $('ad').classList.remove('show'); };
$('btnAdNoAds').onclick = () => openShop();

/* ---------- vitória ---------- */
function win(){
  earned = 10 + level;
  save.coins += earned;
  if (level >= save.unlocked && level < MAX_LEVEL) save.unlocked = level + 1;
  persist();
  beep([523, 659, 784, 1047], .12);
  burst(window.innerWidth / 2, window.innerHeight * .4, palette().slice(0, 8), 60, Math.min(window.innerWidth, 500) * .5);
  const last = level >= MAX_LEVEL;
  $('winTitle').textContent = last ? 'Você zerou o protótipo!' : 'Poções em ordem!';
  $('winText').textContent = `Nível ${level} concluído em ${moves} jogadas.`;
  $('winReward').textContent = `+${earned} 🪙`;
  $('btnNext').textContent = last ? 'Voltar ao menu' : 'Próximo nível';
  $('btnDouble').style.display = '';
  $('btnDouble').textContent = save.noAds ? 'Dobrar moedas' : '📺 Assistir anúncio e dobrar moedas';
  $('win').classList.add('show');
  render();
}
$('btnNext').onclick = () => {
  $('win').classList.remove('show');
  if (level >= MAX_LEVEL){ openHome(); return; }
  const next = level + 1;
  if (level % INTER_EVERY === 0) interstitial(() => startLevel(next)); else startLevel(next);
};
$('btnDouble').onclick = () => {
  rewarded(`+${earned} moedas`, () => {
    save.coins += earned; persist();
    $('winReward').textContent = `+${earned * 2} 🪙`;
    $('btnDouble').style.display = 'none'; render();
  });
};

/* ---------- loja: RevenueCat no app, simulada no navegador ---------- */
let buyCb = null, buying = false;
function confirmBuy(text, cb){ buyCb = cb; $('buyText').textContent = text; $('buy').classList.add('show'); }
// Compra o produto pela App Store (RevenueCat) ou abre o diálogo de teste.
async function purchase(product, text, cb){
  if (!realIap()){ confirmBuy(text, cb); return; }
  if (buying) return;
  buying = true;
  try {
    const r = await N.iap.buy(product);
    if (r === 'ok') cb();
  } catch(e){ toast(e.message || 'Compra não concluída'); }
  finally { buying = false; }
}
// Aplica os não consumíveis que o usuário já tem (vem do RevenueCat).
function applyOwned(list){
  let changed = false;
  if (list.includes('noads') && !save.noAds){ save.noAds = true; changed = true; }
  if (list.includes('theme_ouro') && !save.owned.includes('ouro')){ save.owned.push('ouro'); changed = true; }
  if (changed){ persist(); render(); }
  return changed;
}
$('btnBuyOk').onclick = () => { $('buy').classList.remove('show'); const cb = buyCb; buyCb = null; if (cb) cb(); };
$('btnBuyCancel').onclick = () => { buyCb = null; $('buy').classList.remove('show'); };

function item(left, title, desc, btnText, btnClass, onClick){
  const d = document.createElement('div'); d.className = 'item';
  d.appendChild(left);
  const info = document.createElement('div'); info.className = 'info';
  info.innerHTML = `<b>${title}</b><span>${desc}</span>`;
  d.appendChild(info);
  const b = document.createElement('button'); b.className = 'price ' + (btnClass || ''); b.textContent = btnText;
  if (onClick) b.onclick = onClick; else b.disabled = true;
  d.appendChild(b);
  return d;
}
function emojiBox(e){ const s = document.createElement('div'); s.className = 'bigcoin'; s.textContent = e; return s; }
function miniTube(id){
  const m = document.createElement('div'); m.className = 'mini';
  const c = THEMES[id].colors;
  [c[0], c[5], c[3]].forEach(col => { const i = document.createElement('i'); i.style.background = col; m.appendChild(i); });
  if (id === 'ouro') m.style.borderColor = '#D4AF37';
  if (id === 'neon') m.style.borderColor = '#7DF9FF';
  if (id === 'doces') m.style.borderColor = '#F3A6C8';
  return m;
}
function renderShop(){
  $('shopCoins').textContent = save.coins;
  const na = $('shopNoAds'); na.innerHTML = '';
  na.appendChild(save.noAds
    ? item(emojiBox('🚫'), 'Remover anúncios', 'Ativo. Obrigado pelo apoio!', 'Comprado', 'used')
    : item(emojiBox('🚫'), 'Remover anúncios', 'Sem anúncios entre níveis e recompensas na hora.', priceOf(NOADS.product, NOADS.price), '',
        () => purchase(NOADS.product, `Remover anúncios por ${priceOf(NOADS.product, NOADS.price)}`, () => { save.noAds = true; persist(); renderShop(); render(); toast('Anúncios removidos'); })));
  const cl = $('shopCoinsList'); cl.innerHTML = '';
  COIN_PACKS.forEach(p => {
    const title = `${p.amt} moedas` + (p.tag ? ` <span class="tag">${p.tag}</span>` : '');
    const price = priceOf(p.product, p.price);
    cl.appendChild(item(emojiBox('🪙'), title, `Dá para ${Math.floor(p.amt / HINT_COST)} dicas.`, price, '',
      () => purchase(p.product, `${p.amt} moedas por ${price}`, () => { save.coins += p.amt; persist(); renderShop(); render(); toast(`+${p.amt} moedas`); })));
  });
  const th = $('shopThemes'); th.innerHTML = '';
  Object.keys(THEMES).forEach(id => {
    const t = THEMES[id], owned = save.owned.includes(id), using = save.theme === id;
    let txt, cls, fn;
    if (using){ txt = 'Em uso'; cls = 'used'; fn = null; }
    else if (owned){ txt = 'Usar'; cls = 'owned'; fn = () => { save.theme = id; persist(); applyTheme(); renderShop(); render(); }; }
    else if (t.product){ txt = priceOf(t.product, t.price); cls = ''; fn = () => purchase(t.product, `Estilo ${t.name} por ${txt}`, () => unlockTheme(id)); }
    else { txt = `${t.cost} 🪙`; cls = ''; fn = () => {
      if (save.coins < t.cost){ toast(`Faltam ${t.cost - save.coins} moedas`); return; }
      save.coins -= t.cost; unlockTheme(id);
    }; }
    th.appendChild(item(miniTube(id), t.name, t.desc, txt, cls, fn));
  });
}
function unlockTheme(id){
  if (!save.owned.includes(id)) save.owned.push(id);
  save.theme = id; persist(); applyTheme(); renderShop(); render(); toast(`Estilo ${THEMES[id].name} ativado`);
}
function openShop(){ renderShop(); $('shop').classList.add('show'); }
$('btnCoins').onclick = openShop;
$('btnShopHome').onclick = openShop;
$('btnShopClose').onclick = () => $('shop').classList.remove('show');
$('btnRestore').onclick = async () => {
  if (!realIap()){ toast(N.isNative ? 'Loja indisponível no momento' : 'Modo de teste: nada para restaurar'); return; }
  if (buying) return;
  buying = true; $('btnRestore').textContent = 'Restaurando…';
  try {
    const list = await N.iap.restore();
    applyOwned(list);
    renderShop();
    toast(list.length ? 'Compras restauradas' : 'Nenhuma compra para restaurar');
  } catch(e){ toast('Não foi possível restaurar. Tente de novo.'); }
  finally { buying = false; $('btnRestore').textContent = 'Restaurar compras'; }
};

/* ---------- menu ---------- */
function labels(){
  $('btnSound').textContent = 'Som: ' + (save.sound ? 'ligado' : 'desligado');
  $('btnSym').textContent = 'Símbolos de cor: ' + (save.sym ? 'ligados' : 'desligados');
}
function openHome(){
  $('btnPlay').textContent = `Jogar nível ${save.unlocked}`;
  labels();
  const box = $('levels'); box.innerHTML = '';
  for (let n = 1; n <= MAX_LEVEL; n++){
    const b = document.createElement('button'); b.textContent = n;
    if (n > save.unlocked) b.disabled = true;
    if (n === save.unlocked) b.classList.add('cur');
    b.onclick = () => { $('home').classList.remove('show'); startLevel(n); };
    box.appendChild(b);
  }
  $('home').classList.add('show');
}
$('btnMenu').onclick = () => { if (!busy) openHome(); };
$('btnPlay').onclick = () => { $('home').classList.remove('show'); startLevel(save.unlocked); };
$('btnSound').onclick = () => { save.sound = !save.sound; persist(); labels(); };
$('btnSym').onclick = () => { save.sym = !save.sym; persist(); labels(); render(); };
$('btnReset').onclick = () => {
  if (!confirm(realIap() ? 'Apagar todo o progresso e as moedas? Compras permanentes (sem anúncios, estilo Ouro) continuam valendo.'
                         : 'Apagar todo o progresso, moedas e compras de teste?')) return;
  save = { unlocked:1, coins:0, sound:save.sound, noAds:false, owned:['classico'], theme:'classico', sym:save.sym };
  persist(); applyTheme(); openHome(); startLevel(1);
  if (realIap()) N.iap.owned().then(applyOwned);
};
$('btnPrivacy').onclick = () => N.ads.showPrivacyOptions();

window.addEventListener('resize', () => { if (!busy) render(); });
$('modeNote').textContent = N.isNative ? ''
  : 'Modo navegador: anúncios e compras são simulados. No app eles vêm do AdMob e da App Store.';
applyTheme();
startLevel(save.unlocked);
openHome();

// Serviços nativos depois que o jogo já está na tela.
N.iap.init().then(async () => {
  if (!realIap()) return;
  applyOwned(await N.iap.owned());
  if ($('shop').classList.contains('show')) renderShop();
});
N.ads.init().then(async () => {
  if (await N.ads.privacyOptionsRequired()) $('btnPrivacy').style.display = '';
});
})();
</script>
